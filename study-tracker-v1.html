<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Tracker</title>
<style>
  :root{
    --page-bg: #1b1e1d;
    --device-bg: #f2f0e9;
    --device-border: #d9d4c6;
    --ink: #23272a;
    --ink-soft: #6b6f66;
    --line: #dcd7c9;
    --running: #2f6f52;
    --running-soft: #e3ede7;
    --paused: #a9632c;
    --paused-soft: #f2e6da;
    --danger: #b23a3a;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:var(--page-bg);
    display:flex;
    justify-content:center;
    padding: 28px 12px 60px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
  }

  .device{
    width:100%;
    max-width:480px;
    background:var(--device-bg);
    border:1px solid var(--device-border);
    border-radius:16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    overflow:hidden;
  }

  header{
    padding:18px 20px 14px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid var(--line);
  }
  header h1{
    font-size:1.05rem;
    font-weight:650;
    margin:0;
    letter-spacing:0.01em;
  }
  header .date{
    font-size:0.8rem;
    color:var(--ink-soft);
  }

  section{
    padding:18px 20px;
    border-bottom:1px solid var(--line);
  }
  section:last-child{ border-bottom:none; }

  .section-title{
    font-size:0.78rem;
    color:var(--ink-soft);
    margin:0 0 10px;
  }

  /* Active session card */
  .active-card{
    border-radius:var(--radius);
    padding:20px 16px;
    text-align:center;
    background: var(--running-soft);
    transition: background 0.2s ease;
  }
  .active-card.paused{ background: var(--paused-soft); }
  .active-card.idle{ background: #eceae2; }

  select#categorySelect{
    font-size:0.95rem;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid var(--line);
    background:white;
    color:var(--ink);
    max-width:220px;
  }

  .timer{
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-size:2.6rem;
    font-weight:500;
    margin:14px 0 4px;
    letter-spacing:0.01em;
  }

  .status-label{
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-bottom:14px;
  }

  .btn-row{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:6px;
    flex-wrap:wrap;
  }

  button{
    font-family:inherit;
    font-size:0.88rem;
    padding:10px 18px;
    border-radius:8px;
    border:1px solid transparent;
    cursor:pointer;
    font-weight:550;
  }
  button:disabled{ opacity:0.4; cursor:not-allowed; }

  .btn-start{ background:var(--running); color:white; }
  .btn-pause{ background:var(--paused); color:white; }
  .btn-resume{ background:var(--running); color:white; }
  .btn-finish{ background:var(--ink); color:white; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--ink); }
  .btn-danger{ background:transparent; border:1px solid var(--danger); color:var(--danger); }
  .btn-small{ padding:5px 10px; font-size:0.78rem; }

  /* Today log */
  .totals-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:12px;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:0.76rem;
    padding:4px 9px;
    border-radius:999px;
    background:white;
    border:1px solid var(--line);
  }
  .dot{ width:8px; height:8px; border-radius:50%; flex:none; }

  .session-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:9px 0;
    border-top:1px solid var(--line);
    font-size:0.88rem;
  }
  .session-row:first-of-type{ border-top:none; }
  .session-left{ display:flex; align-items:center; gap:8px; }
  .session-actions{ display:flex; gap:6px; }
  .session-time{ color:var(--ink-soft); font-size:0.78rem; }

  .empty-note{
    color:var(--ink-soft);
    font-size:0.85rem;
    padding:6px 0;
  }

  /* History */
  .history-day{
    border-top:1px solid var(--line);
  }
  .history-day:first-child{ border-top:none; }
  .history-day-head{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    cursor:pointer;
    font-size:0.88rem;
  }
  .history-day-body{
    display:none;
    padding-bottom:10px;
  }
  .history-day-body.open{ display:block; }

  /* Categories manager */
  .cat-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:12px;
  }
  .cat-form{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .cat-form input[type="text"]{
    flex:1;
    min-width:120px;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid var(--line);
    font-size:0.85rem;
  }
  .cat-form input[type="color"]{
    width:38px;
    height:38px;
    padding:2px;
    border-radius:8px;
    border:1px solid var(--line);
  }

  .export-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }

  /* Modal */
  .modal-backdrop{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(20,20,18,0.5);
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:10;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background:var(--device-bg);
    border-radius:12px;
    max-width:420px;
    width:100%;
    max-height:85vh;
    overflow-y:auto;
    padding:20px;
  }
  .modal h2{ font-size:1rem; margin:0 0 14px; }
  .modal label{ display:block; font-size:0.78rem; color:var(--ink-soft); margin:10px 0 4px; }
  .modal input, .modal select{
    width:100%;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid var(--line);
    font-size:0.88rem;
  }
  .interval-row{
    display:flex;
    gap:8px;
    align-items:end;
    margin-bottom:8px;
  }
  .interval-row .field{ flex:1; }
  .modal-actions{
    display:flex;
    justify-content:space-between;
    margin-top:18px;
    gap:8px;
  }
</style>
</head>
<body>

<div class="device">
  <header>
    <h1>Study Tracker</h1>
    <span class="date" id="headerDate"></span>
  </header>

  <!-- Active session -->
  <section>
    <div class="active-card idle" id="activeCard">
      <select id="categorySelect"></select>
      <div class="timer" id="timerDisplay">0:00:00</div>
      <div class="status-label" id="statusLabel">Ready when you are</div>
      <div class="btn-row" id="btnRow"></div>
    </div>
  </section>

  <!-- Today -->
  <section>
    <div class="section-title">Today</div>
    <div class="totals-row" id="todayTotals"></div>
    <div id="todayList"></div>
    <button class="btn-ghost btn-small" id="addManualBtn" style="margin-top:10px;">+ Add session manually</button>
  </section>

  <!-- History -->
  <section>
    <div class="section-title">History</div>
    <div id="historyList"></div>
  </section>

  <!-- Categories -->
  <section>
    <div class="section-title">Categories</div>
    <div class="cat-list" id="catList"></div>
    <div class="cat-form">
      <input type="color" id="newCatColor" value="#3a5a8c">
      <input type="text" id="newCatName" placeholder="New category name">
      <button class="btn-ghost btn-small" id="addCatBtn">Add</button>
    </div>
  </section>

  <!-- Export -->
  <section>
    <div class="section-title">Export</div>
    <div class="export-row">
      <button class="btn-ghost" id="exportTodayBtn">Export today (CSV)</button>
      <button class="btn-ghost" id="exportAllBtn">Export all (CSV)</button>
    </div>
  </section>
</div>

<!-- Edit/Add session modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h2 id="modalTitle">Edit session</h2>
    <label>Category</label>
    <select id="modalCategory"></select>
    <div id="intervalsContainer"></div>
    <button class="btn-ghost btn-small" id="addIntervalBtn" style="margin-top:6px;">+ Add interval</button>
    <div class="modal-actions">
      <button class="btn-danger btn-small" id="deleteSessionBtn">Delete</button>
      <div style="display:flex; gap:8px;">
        <button class="btn-ghost btn-small" id="cancelModalBtn">Cancel</button>
        <button class="btn-start btn-small" id="saveModalBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'studyTracker.v1';
const DEFAULT_COLORS = ['#2f6f52','#3a5a8c','#a9632c','#7a4e8c','#3a8c86','#8c3a55'];

function loadData(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{ return JSON.parse(raw); }catch(e){ /* fall through */ }
  }
  return {
    categories: [
      {id:'cat_studying', name:'Studying', color:'#2f6f52'},
      {id:'cat_reading', name:'Reading', color:'#3a5a8c'},
      {id:'cat_admin', name:'Admin', color:'#a9632c'}
    ],
    sessions: []
  };
}

let data = loadData();
let editingSessionId = null;

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  render();
}

function uid(prefix){
  return prefix + '_' + Date.now() + '_' + Math.floor(Math.random()*10000);
}

function getCategory(id){
  return data.categories.find(c => c.id === id);
}

function activeSession(){
  return data.sessions.find(s => !s.finished);
}

function lastInterval(session){
  return session.intervals[session.intervals.length - 1];
}

function isRunning(session){
  if(!session) return false;
  const last = lastInterval(session);
  return last && !last.end;
}

function sessionDurationMs(session, now){
  let total = 0;
  for(const iv of session.intervals){
    const start = new Date(iv.start).getTime();
    const end = iv.end ? new Date(iv.end).getTime() : (now || Date.now());
    total += Math.max(0, end - start);
  }
  return total;
}

function formatHMS(ms){
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function formatShort(ms){
  const totalMin = Math.round(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if(h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

function toLocalInputValue(isoLike){
  const d = new Date(isoLike);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function dateKey(isoLike){
  const d = new Date(isoLike);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function todayKey(){
  return dateKey(new Date());
}

// ---------- Actions ----------

function startSession(categoryId){
  if(activeSession()) return;
  data.sessions.push({
    id: uid('sess'),
    categoryId,
    finished: false,
    intervals: [{ start: new Date().toISOString(), end: null }]
  });
  save();
}

function pauseSession(){
  const s = activeSession();
  if(!s || !isRunning(s)) return;
  lastInterval(s).end = new Date().toISOString();
  save();
}

function resumeSession(){
  const s = activeSession();
  if(!s || isRunning(s)) return;
  s.intervals.push({ start: new Date().toISOString(), end: null });
  save();
}

function finishSession(){
  const s = activeSession();
  if(!s) return;
  if(isRunning(s)) lastInterval(s).end = new Date().toISOString();
  s.finished = true;
  save();
}

function deleteSession(id){
  data.sessions = data.sessions.filter(s => s.id !== id);
  save();
}

function addCategory(name, color){
  if(!name.trim()) return;
  data.categories.push({ id: uid('cat'), name: name.trim(), color });
  save();
}

// ---------- Rendering ----------

function renderCategorySelect(){
  const sel = document.getElementById('categorySelect');
  sel.innerHTML = '';
  data.categories.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = c.name;
    sel.appendChild(opt);
  });
}

function renderActiveCard(){
  const card = document.getElementById('activeCard');
  const timerEl = document.getElementById('timerDisplay');
  const statusEl = document.getElementById('statusLabel');
  const btnRow = document.getElementById('btnRow');
  const catSelect = document.getElementById('categorySelect');
  const s = activeSession();

  btnRow.innerHTML = '';

  if(!s){
    card.className = 'active-card idle';
    catSelect.disabled = false;
    timerEl.textContent = '0:00:00';
    statusEl.textContent = 'Ready when you are';
    const startBtn = document.createElement('button');
    startBtn.className = 'btn-start';
    startBtn.textContent = 'Start';
    startBtn.onclick = () => startSession(catSelect.value);
    btnRow.appendChild(startBtn);
    return;
  }

  catSelect.value = s.categoryId;
  catSelect.disabled = true;
  const cat = getCategory(s.categoryId);
  timerEl.textContent = formatHMS(sessionDurationMs(s));

  if(isRunning(s)){
    card.className = 'active-card';
    statusEl.textContent = `Running — ${cat ? cat.name : 'Unknown category'}`;
    const pauseBtn = document.createElement('button');
    pauseBtn.className = 'btn-pause';
    pauseBtn.textContent = 'Pause';
    pauseBtn.onclick = pauseSession;
    const finishBtn = document.createElement('button');
    finishBtn.className = 'btn-finish';
    finishBtn.textContent = 'Finish';
    finishBtn.onclick = finishSession;
    btnRow.appendChild(pauseBtn);
    btnRow.appendChild(finishBtn);
  } else {
    card.className = 'active-card paused';
    statusEl.textContent = `Paused — ${cat ? cat.name : 'Unknown category'}`;
    const resumeBtn = document.createElement('button');
    resumeBtn.className = 'btn-resume';
    resumeBtn.textContent = 'Resume';
    resumeBtn.onclick = resumeSession;
    const finishBtn = document.createElement('button');
    finishBtn.className = 'btn-finish';
    finishBtn.textContent = 'Finish';
    finishBtn.onclick = finishSession;
    btnRow.appendChild(resumeBtn);
    btnRow.appendChild(finishBtn);
  }
}

function sessionsForDate(key){
  return data.sessions.filter(s => s.finished && dateKey(s.intervals[0].start) === key);
}

function renderTodaySection(){
  const totalsEl = document.getElementById('todayTotals');
  const listEl = document.getElementById('todayList');
  const key = todayKey();
  const sessions = sessionsForDate(key);

  const totalsByCategory = {};
  sessions.forEach(s => {
    totalsByCategory[s.categoryId] = (totalsByCategory[s.categoryId] || 0) + sessionDurationMs(s);
  });

  totalsEl.innerHTML = '';
  Object.entries(totalsByCategory).forEach(([catId, ms]) => {
    const cat = getCategory(catId);
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `<span class="dot" style="background:${cat ? cat.color : '#999'}"></span>${cat ? cat.name : 'Unknown'} · ${formatShort(ms)}`;
    totalsEl.appendChild(chip);
  });

  listEl.innerHTML = '';
  if(sessions.length === 0){
    listEl.innerHTML = '<div class="empty-note">Nothing logged yet today.</div>';
    return;
  }
  sessions.slice().reverse().forEach(s => {
    listEl.appendChild(buildSessionRow(s));
  });
}

function buildSessionRow(s){
  const cat = getCategory(s.categoryId);
  const row = document.createElement('div');
  row.className = 'session-row';
  const first = s.intervals[0];
  const last = s.intervals[s.intervals.length - 1];
  const timeRange = `${new Date(first.start).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})} – ${last.end ? new Date(last.end).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '…'}`;

  row.innerHTML = `
    <div class="session-left">
      <span class="dot" style="background:${cat ? cat.color : '#999'}"></span>
      <div>
        <div>${cat ? cat.name : 'Unknown'} · ${formatShort(sessionDurationMs(s))}</div>
        <div class="session-time">${timeRange}${s.intervals.length > 1 ? ' · ' + s.intervals.length + ' parts' : ''}</div>
      </div>
    </div>
  `;
  const actions = document.createElement('div');
  actions.className = 'session-actions';
  const editBtn = document.createElement('button');
  editBtn.className = 'btn-ghost btn-small';
  editBtn.textContent = 'Edit';
  editBtn.onclick = () => openEditModal(s.id);
  actions.appendChild(editBtn);
  row.appendChild(actions);
  return row;
}

function renderHistorySection(){
  const listEl = document.getElementById('historyList');
  const key = todayKey();
  const dateKeys = [...new Set(data.sessions.filter(s => s.finished).map(s => dateKey(s.intervals[0].start)))]
    .filter(k => k !== key)
    .sort((a,b) => b.localeCompare(a));

  listEl.innerHTML = '';
  if(dateKeys.length === 0){
    listEl.innerHTML = '<div class="empty-note">No previous days yet.</div>';
    return;
  }

  dateKeys.forEach(k => {
    const sessions = sessionsForDate(k);
    const total = sessions.reduce((sum, s) => sum + sessionDurationMs(s), 0);
    const day = document.createElement('div');
    day.className = 'history-day';
    const head = document.createElement('div');
    head.className = 'history-day-head';
    head.innerHTML = `<span>${new Date(k).toDateString()}</span><span>${formatShort(total)}</span>`;
    const body = document.createElement('div');
    body.className = 'history-day-body';
    sessions.forEach(s => body.appendChild(buildSessionRow(s)));
    head.onclick = () => body.classList.toggle('open');
    day.appendChild(head);
    day.appendChild(body);
    listEl.appendChild(day);
  });
}

function renderCategoriesSection(){
  const listEl = document.getElementById('catList');
  listEl.innerHTML = '';
  data.categories.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `<span class="dot" style="background:${c.color}"></span>${c.name}`;
    listEl.appendChild(chip);
  });
}

function render(){
  document.getElementById('headerDate').textContent = new Date().toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
  renderCategorySelect();
  renderActiveCard();
  renderTodaySection();
  renderHistorySection();
  renderCategoriesSection();
}

// live timer tick while running
setInterval(() => {
  const s = activeSession();
  if(s && isRunning(s)){
    document.getElementById('timerDisplay').textContent = formatHMS(sessionDurationMs(s));
  }
}, 1000);

// ---------- Manual add / edit modal ----------

function openEditModal(sessionId){
  editingSessionId = sessionId;
  const s = data.sessions.find(x => x.id === sessionId);
  document.getElementById('modalTitle').textContent = 'Edit session';
  populateModalCategorySelect(s.categoryId);
  renderIntervalRows(s.intervals);
  document.getElementById('deleteSessionBtn').style.display = 'inline-block';
  document.getElementById('modalBackdrop').classList.add('open');
}

function openAddModal(){
  editingSessionId = null;
  document.getElementById('modalTitle').textContent = 'Add session';
  populateModalCategorySelect(data.categories[0] ? data.categories[0].id : null);
  const now = new Date();
  const anHourAgo = new Date(now.getTime() - 60*60*1000);
  renderIntervalRows([{ start: anHourAgo.toISOString(), end: now.toISOString() }]);
  document.getElementById('deleteSessionBtn').style.display = 'none';
  document.getElementById('modalBackdrop').classList.add('open');
}

function populateModalCategorySelect(selectedId){
  const sel = document.getElementById('modalCategory');
  sel.innerHTML = '';
  data.categories.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = c.name;
    if(c.id === selectedId) opt.selected = true;
    sel.appendChild(opt);
  });
}

function renderIntervalRows(intervals){
  const container = document.getElementById('intervalsContainer');
  container.innerHTML = '';
  intervals.forEach((iv, idx) => {
    const row = document.createElement('div');
    row.className = 'interval-row';
    row.dataset.index = idx;
    row.innerHTML = `
      <div class="field">
        <label>Start</label>
        <input type="datetime-local" class="iv-start" value="${toLocalInputValue(iv.start)}">
      </div>
      <div class="field">
        <label>End</label>
        <input type="datetime-local" class="iv-end" value="${iv.end ? toLocalInputValue(iv.end) : ''}">
      </div>
      <button class="btn-ghost btn-small remove-interval" type="button">✕</button>
    `;
    row.querySelector('.remove-interval').onclick = () => row.remove();
    container.appendChild(row);
  });
}

document.getElementById('addManualBtn').onclick = openAddModal;

document.getElementById('addIntervalBtn').onclick = () => {
  const container = document.getElementById('intervalsContainer');
  const now = new Date().toISOString();
  const rows = container.querySelectorAll('.interval-row');
  const idx = rows.length;
  const row = document.createElement('div');
  row.className = 'interval-row';
  row.dataset.index = idx;
  row.innerHTML = `
    <div class="field">
      <label>Start</label>
      <input type="datetime-local" class="iv-start" value="${toLocalInputValue(now)}">
    </div>
    <div class="field">
      <label>End</label>
      <input type="datetime-local" class="iv-end" value="${toLocalInputValue(now)}">
    </div>
    <button class="btn-ghost btn-small remove-interval" type="button">✕</button>
  `;
  row.querySelector('.remove-interval').onclick = () => row.remove();
  container.appendChild(row);
};

document.getElementById('cancelModalBtn').onclick = () => {
  document.getElementById('modalBackdrop').classList.remove('open');
};

document.getElementById('deleteSessionBtn').onclick = () => {
  if(editingSessionId && confirm('Delete this session?')){
    deleteSession(editingSessionId);
    document.getElementById('modalBackdrop').classList.remove('open');
  }
};

document.getElementById('saveModalBtn').onclick = () => {
  const categoryId = document.getElementById('modalCategory').value;
  const rows = document.querySelectorAll('#intervalsContainer .interval-row');
  const intervals = [];
  for(const row of rows){
    const startVal = row.querySelector('.iv-start').value;
    const endVal = row.querySelector('.iv-end').value;
    if(!startVal) continue;
    intervals.push({
      start: new Date(startVal).toISOString(),
      end: endVal ? new Date(endVal).toISOString() : null
    });
  }
  if(intervals.length === 0){
    alert('Add at least one interval with a start time.');
    return;
  }
  intervals.sort((a,b) => new Date(a.start) - new Date(b.start));

  if(editingSessionId){
    const s = data.sessions.find(x => x.id === editingSessionId);
    s.categoryId = categoryId;
    s.intervals = intervals;
    s.finished = intervals.every(iv => iv.end);
  } else {
    data.sessions.push({
      id: uid('sess'),
      categoryId,
      finished: intervals.every(iv => iv.end),
      intervals
    });
  }
  document.getElementById('modalBackdrop').classList.remove('open');
  save();
};

// ---------- Categories ----------

document.getElementById('addCatBtn').onclick = () => {
  const nameInput = document.getElementById('newCatName');
  const colorInput = document.getElementById('newCatColor');
  addCategory(nameInput.value, colorInput.value);
  nameInput.value = '';
  const nextColor = DEFAULT_COLORS[data.categories.length % DEFAULT_COLORS.length];
  colorInput.value = nextColor;
};

// ---------- CSV export ----------

function intervalsToRows(sessions){
  const rows = [];
  sessions.forEach(s => {
    const cat = getCategory(s.categoryId);
    s.intervals.forEach(iv => {
      if(!iv.end) return; // skip an in-progress interval
      const start = new Date(iv.start);
      const end = new Date(iv.end);
      const durationMin = (end - start) / 60000;
      rows.push([
        dateKey(iv.start),
        cat ? cat.name : 'Unknown',
        start.toTimeString().slice(0,8),
        end.toTimeString().slice(0,8),
        durationMin.toFixed(2)
      ]);
    });
  });
  return rows;
}

function downloadCSV(rows, filename){
  const header = ['date','category','start_time','end_time','duration_minutes'];
  const csv = [header, ...rows].map(r => r.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById('exportTodayBtn').onclick = () => {
  const sessions = sessionsForDate(todayKey());
  const rows = intervalsToRows(sessions);
  if(rows.length === 0){ alert('No completed sessions today yet.'); return; }
  downloadCSV(rows, `study-tracker_${todayKey()}.csv`);
};

document.getElementById('exportAllBtn').onclick = () => {
  const sessions = data.sessions.filter(s => s.finished);
  const rows = intervalsToRows(sessions);
  if(rows.length === 0){ alert('No completed sessions yet.'); return; }
  downloadCSV(rows, `study-tracker_all.csv`);
};

render();
</script>
